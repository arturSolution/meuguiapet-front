name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop   # 👉 você pode trocar para main se quiser deploy em produção

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16.19.0'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Archive build
        uses: actions/upload-artifact@v3
        with:
          name: deploy_dist
          path: ./deploy_dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-20.04
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: deploy_dist
          path: ./dist

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages       # branch onde será publicado
          folder: ./deploy_dist  # pasta do build gerado
