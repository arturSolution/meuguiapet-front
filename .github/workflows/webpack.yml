name: Webpack Build & Deploy

on:
  push:
    branches:
      - develop   # Build em dev      
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci

      - name: Build with Webpack
        run: npm run build  # ajuste se o comando for diferente

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: webpack_dist
          path: dist

      - name: Deploy JS/CSS to GitHub Pages
        if: github.ref == 'refs/heads/develop'   # só deploy em produção
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
